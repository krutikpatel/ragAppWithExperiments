[project]
name = "rag"
version = "0.0.1"
description = "RAG experiment platform over the WixQA benchmark"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "ranx>=0.3.20",
    "httpx>=0.27",
    # Judged generation metrics. PINNED EXACTLY, not floored: Ragas revises metric
    # prompts between releases, and a silent prompt change would move every
    # historical judged score without any config changing. See MIS-004 / DEC-021.
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which
    # langchain-community 0.4.x removed. Its own dependency spec does not exclude
    # 0.4.x, so this ceiling is ours to hold. See MIS-004.
    "langchain-community<0.4",
    "rank-bm25>=0.2.2",
    # Corpus profiling only (`rag corpus profile`): BPE token counts with cl100k_base,
    # the encoding DEC-029 measured with. Never on the retrieval or scoring path.
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# P3-13 (DEC-097): the answer API and demo page. Optional, so the core install and CI's
# unit tests do not need a web server.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
