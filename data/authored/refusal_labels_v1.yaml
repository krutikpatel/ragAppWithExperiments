- question_id: 53b0fccf617f10c2
  question: Why was my account charged?
  refused: false
  answer: 'Your charge is most likely from a renewal of one of your Wix subscriptions or an app/service
    you’re using. You can check your current subscriptions in the Premium Subscriptions section of your
    Wix account and view invoices for payments on the Billing History page. [doc:b548d310006dff958a440cb69eaa2f7a9c99e0fd0e9ae48df23c7362633dde1e]


    If you’re seeing a double charge, it could be an authorization (pending charge) that hasn’t yet been
    replaced by the actual payment, or it could be a previous failed payment that was retried along with
    a current payment. Check the invoice numbers to see which service each payment is for. If it’s still
    unclear, contact support with a screenshot of your bank statement showing the last 4 digits of your
    card. [doc:d22b8cf6e599e0b87d177e1f66a122ce604d5b9b7ace1e7a54649f684f322ae1]


    If you were charged for a domain purchase with a free domain voucher, it could be for additional years,
    or for private domain registration. Review your domain voucher details for clarity. [doc:ed9785db78000e68c77769a53a66455fe93645aa6f1327adf0f02d8c068fa0c0]


    To identify unknown charges, use the charge locator tool with the invoice number, last 4 digits of
    the card, and card expiry date, or check the charge inside Billing History in your Wix account. [doc:ca71d6147b445ab43e7febb190b76627e019b47f18566203fbb4d7c3dd504b4a]'
