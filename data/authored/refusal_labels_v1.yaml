  question: How do I make it look better?
  refused: false
  answer: 'To make it look better, follow the guidance in the Wix Help Center articles about improving
    visuals and design quality.


    1. Add eye-catching images that enhance your message and are high-quality. [doc:7e0ba3c0a6fc08c5c800800dfff21dba311401bf0a0b88c29cffc2dcb546820a]

    2. Use images strategically and avoid overloading your page with too many images. [doc:7e0ba3c0a6fc08c5c800800dfff21dba311401bf0a0b88c29cffc2dcb546820a]

    3. If you want a frosted glass look on boxes, apply the glass effect to add depth. [doc:9a1d44526c4eef379128ec0759e556a829fccd2d4763c9a2d1818335d31d26c1]

    4. Adjust image settings for better quality: rotate/or flip, adjust brightness, contrast, and color
    to improve appearance. [doc:e705293545888d6bfd1942b07a940165bffc8c4b3cc30e02de4eeecf24a060f9]

    5. Use image optimization features to quickly improve image quality (AI Tools, Optimize image). [doc:e705293545888d6bfd1942b07a940165bffc8c4b3cc30e02de4eeecf24a060f9]

    6. If you’re working with a gallery in ADI, you can change the layout to better showcase images. [doc:dab8546a05cddbc2a4375843d9b25386ef8cc1265fb1e78a94d5425992a62750]

    7. Add titles and descriptions to gallery items to provide context and improve presentation. [doc:dab8546a05cddbc2a4375843d9b25386ef8cc1265fb1e78a94d5425992a62750]


    Note: The above steps reference the article IDs that cover image quality, glass effects, and gallery
    improvements. If you want more specific guidance, tell me what element you’re adjusting (images, boxes,
    gallery, etc.).'
- question_id: 660557c3fe67f9a3
  question: Which Wix Bookings features shipped after December 2024?
  refused: false
  answer: 'Wix Bookings features shipped after December 2024 include the ability to customize the settings
    of individual services (including early/late bookings and cancelling or rescheduling) independently
    for each service. [doc:f1d067dd4273be2efa5ff0d2794c7f6c878232dec8a9560f9de898d75d710d63]


    You can also enable multi-service bookings, allowing clients to book multiple services in a single
    appointment, with the calendar automatically calculating availability for the entire appointment.
    [doc:7fc450319519e8b38ebf7ea477106862fded269afe07d9bcd0f1c93a19c708b6]


    Additionally, you can manage multi-service appointments by turning on the multi-service appointment
    toggle in Bookings settings. [doc:7fc450319519e8b38ebf7ea477106862fded269afe07d9bcd0f1c93a19c708b6]'
