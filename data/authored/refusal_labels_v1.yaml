- question_id: a2ff5a2f197c27d4
  question: Why isn't my site working?
  refused: false
  answer: "If your site isn’t working, use the steps below to troubleshoot. [doc:4e a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ [doc:77c054b29c894610643f474b8ddf92ab5d587006d3e23d13d38da92df7944d8e] [doc:7948198295c48d42124c8411929f21ae4054cd6d4638098c601fe9a76e611a83]\
    \ \n\n1. Make sure you’re entering the correct domain name or site URL in your browser. [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ \n2. Check that your site is published in your editor and that the domain is connected. [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ \n3. Verify your domain hasn’t expired and that your plan is active. [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ \n4. Confirm your domain is assigned to your site on the Domains page. [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ \n5. Check that your DNS settings are correct and that up to 48 hours have passed for propagation.\
    \ [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c] \n6. Ensure you’re using\
    \ a supported, up-to-date browser. [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c]\
    \ \n7. If you’re using a public computer, consider whether access to Wix servers may be restricted.\
    \ [doc:a4e961a185fa6ceaa1bce7766f2ae55a7b1a1e337493f07fa6cf68a10834bb1c] \n8. If the problem persists,\
    \ use the Wix Technical Assistant to solve live site issues. [doc:77c054b29c894610643f474b8ddf92ab5d587006d3e23d13d38da92df7944d8e]"
