- question_id: 18e7e8d3544ed685
  question: How do I get it approved?
  refused: false
  answer: '1. To approve requests to join your program, go to Online Programs in your site''s dashboard.
    [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]

    2. Click the relevant program. [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]

    3. Click Manage next to Participants. [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]

    4. Click the Pending tab. [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]

    5. Click Approve next to the member(s) you want to approve. [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]


    If you’re using the Wix App to manage, use these steps:


    1. Go to your site in the Wix app. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    2. Tap Manage at the bottom. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    3. Tap Online Programs. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    4. Tap the program you want to manage. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    5. Tap Request to Join at the top. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    6. Tap Approve next to the member you want to approve. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]

    7. When ready, tap Done. [doc:23e747336cfe9184d8f39340b7cd88de72e39e940274ae0f12811bb9b9ff17c0]


    Note: If your program has a price, new participants are automatically approved once they make the
    payment. [doc:d8922b9fdbebbcc5e5041ba1ecf3296cc858e43dd2bef6c26ee875211a6894a0]'
