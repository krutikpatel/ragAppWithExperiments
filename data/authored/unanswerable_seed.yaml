# Unanswerable evaluation set — P0-04.
#
# WixQA ships no questions the system should refuse, so this set is authored.
#
# HARD CONSTRAINT: this set is NOT built by removing articles from the index.
# Deleting articles would change corpus_hash and break comparability with every
# other run. Every question here is unanswerable from the *complete*, frozen
# 2024-12-02 corpus.
#
# Provenance
#   drafted_by:   claude-opus-5 (Claude Code session, 2026-09-09)
#   verified_by:  PENDING — no human has reviewed these yet
#   verification: each question must be confirmed to have no grounded answer in
#                 the frozen corpus before any refusal number is quoted as a
#                 result. Set `verified_by` and `verified_on` once done.
#
# Buckets
#   out-of-scope-platform  same task, a competing platform. The corpus is Wix-only.
#   post-snapshot          explicitly asks about a period after 2024-12-02, so no
#                          snapshot of the KB could contain the answer. Phrased by
#                          date rather than by naming a specific later feature, so
#                          that the question stays unanswerable without asserting
#                          anything about what Wix actually shipped.
#   underspecified         no referent. Cannot be grounded in any single article.

meta:
  drafted_by: claude-opus-5
  drafted_on: "2026-09-09"
  verified_by: null
  verified_on: null
  corpus_snapshot_date: "2024-12-02"

