<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WixQA RAG</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1b; --muted:#6b6b66; --line:#e3e2dc; --accent:#2f5d8a; --warn:#9a4a0b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#a3a29b; --line:#34332f; --accent:#8fb6dc; --warn:#e3a36a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:10px 12px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:6px; }
  button { padding:10px 16px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #answer { white-space: pre-wrap; margin: 24px 0 8px; }
  .refused { color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; margin: 28px 0 8px; }
  .cite { border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin: 0 0 12px; }
  .cite a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .cite .flag { color: var(--warn); font-size: 13px; }
  .cite pre { white-space: pre-wrap; font: 14px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); margin: 8px 0 0; max-height: 240px; overflow:auto; }
  .error { color: var(--warn); margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>WixQA RAG</h1>
  <p class="sub">Ask a Wix support question. The answer cites the Help Center articles it used; each citation shows the exact paragraph the model was given.</p>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="e.g. How do I restore a collection from a backup?" required>
    <button id="b">Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim(), b = document.getElementById("b"), out = document.getElementById("out");
  if (!q) return;
  b.disabled = true; out.innerHTML = '<p class="meta">Answering…</p>';
  try {
    const r = await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question:q})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    const m = d.meta;
    let html = `<div id="answer" class="${d.refused ? "refused" : ""}">${esc(d.answer)}</div>`;
    html += `<p class="meta">${d.refused ? "Refused · " : ""}${m.latency_ms} ms · $${m.cost_usd.toFixed(6)}${m.replayed ? " · replayed from the gate's cache" : ""} · config ${esc(m.config_hash)}</p>`;
    if (d.citations.length) {
      html += "<h2>Sources</h2>" + d.citations.map(c => `<div class="cite">
        ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.article_title || c.doc_id)}</a>` : `<strong>${esc(c.article_title || c.doc_id)}</strong>`}
        ${c.in_context ? "" : `<div class="flag">Cited, but this article was not retrieved — an invented id.</div>`}
        ${c.chunk_text ? `<pre>${esc(c.chunk_text)}</pre>` : ""}</div>`).join("");
    }
    out.innerHTML = html;
  } catch (err) {
    out.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  } finally { b.disabled = false; }
});
</script>
</body>
</html>
