# ci/phase3_baseline.yaml — what the `phase3-baseline-v2` git tag froze (DEC-080).
#
# Every Phase 3 comparison is against this. It is a record, not a config: the runner
# never reads it. tests/test_model_check_p3_02.py asserts the files it names still
# hash to what is written here, so the freeze cannot drift silently. Changing any of
# it needs a DECISIONS.md entry and a new version of this file (P3-03 / P3-11).
