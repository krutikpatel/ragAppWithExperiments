# Version 1 (tag `phase3-baseline`, 2026-09-27, DEC-071) froze the same retrieval,
# generator and prompt with the placeholder judge openai/gpt-oss-120b, which DEC-073
# later refused as same-lab. Version 2 changes the judge and adds the golden slice;
# everything else is carried over unchanged and re-verified. v1 is in git at that tag.
#
# Every value below was read off a command on 2026-09-28, named beside it.

