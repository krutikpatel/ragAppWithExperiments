# ci/gate.yaml — the rules `rag ci-eval` applies.
#
# STATUS: DECLARED (P3-09, DEC-087), version 5 (DEC-095, DEC-096: gold-in-context on dev gates; v4: thresholds matched on the judge side
# only; gold-in-context on dev reported, to become gating once the baseline carries it), version 3 (DEC-091: thresholds sized for comparing TWO
# runs, after the first GitHub run false-alarmed — MIS-047; v2, DEC-088: judge failures are
# errors and the CI budget is set). Changing any
# rule or threshold is a new version with its own DECISIONS.md entry. Every threshold
# comes from a measurement, not a guess: α from DEC-082, MDDs from rag/eval/noise_floor.py
# (DEC-083, DEC-087). Published detection floors: ci/DETECTION_FLOOR.md.
status: declared
version: 5
decision: DEC-095

# What runs.
configs:
  dev_retrieval: configs/promoted.yaml            # Tier 1 on all of dev
  golden: configs/golden_generate_v2.yaml         # Tier 2 generation on golden_v1
  judge: configs/baseline_dense_tier2_v2.yaml     # judge fields for `rag faithfulness`

# A result that does not have exactly these question counts is schema-invalid.
expected_questions: {dev: 200, golden: 95, answers: 95}

# Spend: a run estimated above this stops with "needs approval"; a maintainer's
# `eval-approved` label re-runs it with approval (P3-10, DEC-088). An uncached run costs
# about $0.30 (EXP-0060), a cached one $0.
ci_budget_usd: 1.00

alpha: 0.05
noise_floor_family: golden-v1-deepseek
# The gate compares a fresh run to a baseline run: two draws. `pairwise_floors` = 2·√2·stdev
# over five fresh golden runs (DEC-091). `floors` (one run's spread) under-sized it (MIS-047).
threshold_kind: pairwise_floors

# The baseline changes only through `rag ci-baseline update --reason <DEC-id>`. An
# improvement NEVER updates it automatically.
baseline_updates: manual

# Retrieval: fail when recall@5 on dev drops AND the exact paired test is significant at
# alpha. Lost and gained question ids are always listed, pass or fail.
retrieval:
  - {metric: strict_recall@5, run: dev, gating: true}
  - {metric: strict_recall@5, run: golden, gating: false}
  # Did every gold article reach the generator? The metric a `top_k` regression moves
  # (recall@5 is read off the ranking and cannot). Gating since v5; the baseline carries it (DEC-096).
  - {metric: gold_in_context, run: dev, gating: true}

# Judged and generated: fail when the change in the bad direction exceeds the metric's
# pairwise threshold in the matched noise-floor family; smaller changes pass "within noise". No matching family
# means the metric cannot be gated and the verdict is FAIL (fail closed). All three judged
# metrics are gating because the production judge passed P3-04 (DEC-079).
judged:
  - {metric: mean_faithfulness, better: higher, gating: true}        # threshold 0.032
  - {metric: unsupported_answer_rate, better: lower, gating: true}   # threshold 0.109
  - {metric: false_answer_rate, better: lower, gating: true}         # threshold 0.158 (3 of 15)
  - {metric: citation_validity, better: higher, gating: true}        # threshold 0.051
  - {metric: refusal_rate, better: lower, gating: false}             # threshold 0.078
  - {metric: citation_integrity, better: higher, gating: false}      # superseded by citation_validity

# Deterministic hard fails, zero tolerance.
hard_fails:
  - cites_unretrieved_article   # a citation to a REAL article that was not in the answer's context: 0 in 481 answers, six fresh runs
  - schema_invalid              # the result is missing fields, mistyped, or has the wrong question counts
  - empty_answer                # a generated answer with no text
  - question_set_changed        # the run's question ids differ from the baseline's
  - provenance_changed          # corpus, split, judge or judge prompt version differs from the baseline's

# Errors, not quality failures (P3-10): the job ends as ERROR / "not verified", which also
# blocks merge, but never reads as the system getting worse.
errors:
  - judge_failure               # an answered question the judge could not score after its retries
