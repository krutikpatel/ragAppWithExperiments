id: judge_faithfulness
description: >
  Are the claims in the generated answer supported by the retrieved context?
  Grounding only — a wrong-but-grounded answer scores high here and is caught by
  answer correctness instead.
versions:
  v1:
    description: Binary-per-claim faithfulness, averaged, with unsupported claims listed.
    template: |
      You are grading whether an answer is grounded in the context it was given.

      Judge ONLY grounding. Do not use outside knowledge. Do not reward or
      penalise the answer for being helpful, complete, or well written. An answer
      that is factually wrong but fully supported by the context is FAITHFUL.

      CONTEXT:
      {context}

      ANSWER:
      {answer}

      Break the answer into its factual claims. A claim is supported if the
      context states it or directly entails it. Generic pleasantries and
      restatements of the question are not claims.

      Reply with JSON only:
      {{"score": <supported claims / total claims, 0.0-1.0>,
        "n_claims": <integer>,
        "unsupported": ["<claim>", ...],
        "reasoning": "<two sentences at most>"}}
