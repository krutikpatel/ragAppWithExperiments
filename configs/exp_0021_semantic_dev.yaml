# EXP-0021 — Axis 1 (chunking, P2-07): semantic chunking (cut where consecutive-sentence similarity drops, 95th percentile per article).
#
# Diff against configs/promoted.yaml (the dense control, fixed-600/100): the chunker
# only. Same embedder (qwen3-embedding-8b on DeepInfra), same document-level top_k 5
# over a 50-chunk pool (DEC-040). A new chunker is a new index key: the dev_large run
# builds it (full-corpus embed, ~$0.03), the dev run reuses it.
#
# PRE-SPEND: every sentence is embedded once (same qwen3 model, DeepInfra) to find the boundaries, ~$0.03, before the index build (~$0.03). Gated by --estimate-only like an index build; distances cached under indexes/sentence_distances/.
#
# Split policy (DEC-055): dev decides; dev_large is the single-document direction
# check. Pre-registered expectations: docs/HYPOTHESES.md H-013..H-016. DEC-057.
name: EXP-0021 semantic chunking (cut where consecutive-sentence similarity drops, 95th percentile per article) — qwen3-embedding-8b (DeepInfra), top-5 distinct docs, pool 50, Tier 1, dev
axis: chunking
split: dev
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: semantic
chunker_params:
  threshold_percentile: 95
  max_words: 600
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 256
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
