# EXP-0069 — Jev 50 -> top-10 at Tier 2 with a P(relevant) floor of 0.4 (OQ-054, DEC-102)
#
# One dimension against EXP-0068: only `reranker_params.context_floor` moves, unset -> 0.4
# (Krutik's value). Chunks Jev scores below 0.4 cannot reach the generator, so a question
# gets 0-10 documents instead of always 10. The ranking is untouched (a test asserts it),
# so no retrieval metric can move; only generation metrics are reported. Replayed on
# EXP-0068's stored scores first (OQ-054): 8.53 documents per question, gold in context
# 0.880 -> 0.840, no empty context. This run re-calls Jev, so its scores carry Jev's own
# run-to-run noise (OQ-055) on top of the floor. Judge skipped (DEC-063), as in EXP-0068.
name: "EXP-0069 — Jev 50 -> top-10, floor 0.4, Tier 2 dev: does dropping low-scored documents help the generator? (OQ-054)"
axis: assembly
split: dev
eval_tier: tier2
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 10
reranker: typesafe_jev
reranker_params:
  model: jev-1.13.0
  prompt_version: v1
  workers: 8
  context_floor: 0.4
rerank_candidates: 50
doc_pooling: max
seed: 1
generator_model: openai/gpt-5-nano
generator_prompt: baseline_answer@v1
skip_judge: true
