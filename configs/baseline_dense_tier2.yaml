# The dense control, Tier 2 (P1-07 run 2): generation with the frozen Phase 1
# prompt (baseline_answer@v1, DEC-042) and judge metrics on the fixed 100-question
# dev subsample. Retrieval is exactly configs/baseline_dense.yaml (EXP-0005).
#
# Judged metrics still come from the PLACEHOLDER judge (DEC-018/030) and stay in
# the results store; citation precision/recall, refusal, URL count and step
# coverage are deterministic and reportable. `rag ask` uses this config by default.
name: EXP-0006 dense control, Tier 2 — qwen3-embedding-8b, 600/100, top-5 distinct docs, baseline_answer@v1, dev subsample
split: dev
eval_tier: tier2
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
generator_model: openai/gpt-5-nano
generator_prompt: baseline_answer@v1
judge_model: openai/gpt-oss-120b
judge_embedding_model: qwen/qwen3-embedding-8b
