# EXP-0033 — Axis 4 (query transformation): multi-query expansion, Tier 1 dev.
#
# P2-12. Three paraphrases of the question, retrieved for alongside the original and
# fused by RRF, on the claim that one phrasing matches vocabulary the others miss.
# Unlike decomposition the rewrites are meant to be EQUIVALENT to the question rather
# than parts of it, so the original is kept: dropping it would discard the one phrasing
# known to be faithful.
#
# A rewrite that comes back identical to the original is dropped by the parser. Left in,
# it would double that ranking's weight in the fusion and quietly bias the result back
# towards the untransformed question — which would look like "expansion does nothing".
name: "EXP-0033 multi-query expansion — 3 paraphrases plus the original, RRF fused, dev"
axis: query_transform
split: dev
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
query_transform: multi_query
query_transform_params:
  model: openai/gpt-oss-20b
  n: 3
