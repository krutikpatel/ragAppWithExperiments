# EXP-0070 — Jev with the article title in its state (OQ-059, DEC-102)
#
# Identical to configs/exp_0066_rerank_jev_c10_dev.yaml except
# `reranker_params.include_title: true`: Jev's state passage becomes {"title", "text"}
# instead of the chunk text alone. 25% of EXP-0065's candidate chunks were not their
# article's first chunk, so Jev saw them with no title. Built on EXP-0066's 10-candidate
# shape because it is the cheapest Jev config and has two runs to compare against. Two
# runs, because Jev's scores are not repeatable (OQ-055). Decided by OQ-059.
name: "EXP-0070 — Axis 5 reranking: TypeSafe Jev jev-1.13.0, 10 candidate docs -> top-5, title in state"
axis: reranking
split: dev
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
reranker: typesafe_jev
reranker_params:
  model: jev-1.13.0
  prompt_version: v1
  workers: 8
  include_title: true
rerank_candidates: 10
doc_pooling: max
seed: 1
