# EXP-0008 — Axis 2 baseline: the promoted dense control (qwen3-embedding-8b, DeepInfra)
# run on dev_large. P2-08 decides embeddings on dev_large and confirms on dev; the
# control has only ever run on dev (EXP-0005), so this is the dev_large baseline every
# embedding candidate is compared against. Same index as EXP-0005 (cached). DEC-054.
name: EXP-0008 dense control on dev_large — qwen3-embedding-8b (DeepInfra), 600/100, top-5 distinct docs
axis: embedding
split: dev_large
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
