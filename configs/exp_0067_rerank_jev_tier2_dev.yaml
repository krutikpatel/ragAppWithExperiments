# EXP-0067 — Jev reranking at Tier 2: 50 candidate documents -> top 5 reach the generator
#
# EXP-0065's retrieval with answers generated on the fixed 100-question dev subsample.
# One dimension against EXP-0006 (run_20260913_205058_dc03, the dense control at Tier 2):
# only the reranker moves. It is also the top-5 half of OQ-058's pair with EXP-0068.
# Judge skipped as in EXP-0051 (DEC-063): the deterministic generation metrics
# (gold in context, citation precision/recall, step coverage, refusal) decide.
name: "EXP-0067 — Jev 50 -> top-5, Tier 2 dev: answers generated (the top-5 side of OQ-058)"
axis: reranking
split: dev
eval_tier: tier2
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
reranker: typesafe_jev
reranker_params:
  model: jev-1.13.0
  prompt_version: v1
  workers: 8
rerank_candidates: 50
doc_pooling: max
seed: 1
generator_model: openai/gpt-5-nano
generator_prompt: baseline_answer@v1
skip_judge: true
