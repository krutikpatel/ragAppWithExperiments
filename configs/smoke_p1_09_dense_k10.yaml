# P1-09 diffability smoke test. configs/baseline_dense.yaml with exactly one change:
# top_k 5 -> 10. Exists to prove `rag diff <this run> <baseline_dense run>` produces a
# sensible flip list. Under DEC-040, top_k governs the context, not the scored
# ranking, so the flips are expected on `gold_in_context`, not on strict_recall@5.
# A harness check, not an experiment: no EXP row.
name: P1-09 diffability smoke test — baseline_dense with top_k 10 (only change)
split: dev
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 10
doc_pooling: max
seed: 1
