# EXP-0010 — Axis 2, candidate 3: baai/bge-m3, pinned to DeepInfra (served as
# baai/bge-m3-20251117, fp32; DEC-054). Same provider as the qwen control on purpose.
# No prefix convention (bge-m3 needs none; table entry). Full re-index: ~$0.03 estimated.
# The dev confirmation run (P2-04); the index is cached from the dev_large run.
name: EXP-0010 bge-m3 (DeepInfra) on dev — 600/100, top-5 distinct docs
axis: embedding
split: dev
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: baai/bge-m3
  embedding_provider: DeepInfra
  # 5, not 64: OpenRouter filters DeepInfra's bge-m3 endpoint out when a batch's
  # TOTAL tokens exceed its 8,192 context, and a pinned provider has no fallback.
  # 5 x the longest chunk (1,336 tokens) stays under. MIS-023.
  batch_size: 5
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
