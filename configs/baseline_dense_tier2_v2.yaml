# The dense control, Tier 2, version 2 (DEC-080): configs/baseline_dense_tier2.yaml with
# the production judge chosen by P3-04 (DEC-079). Nothing else differs: same retrieval
# (EXP-0005), same generator, same prompt baseline_answer@v1, same 100-question dev
# subsample.
#
# Why a new file rather than an edit: the v1 file is pinned byte-for-byte by
# ci/phase3_baseline.yaml version 1 and the `phase3-baseline` tag, and its gpt-oss judge
# is now a refused same-lab pairing (DEC-073). The judge here is exactly the one P3-04
# validated: one host, no fallbacks, temperature 0.
name: dense control v2, Tier 2 — qwen3-embedding-8b, 600/100, top-5 distinct docs, baseline_answer@v1, judge deepseek-v4.1-flash@DeepInfra, dev subsample
split: dev
eval_tier: tier2
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
candidate_pool: 50
top_k: 5
doc_pooling: max
seed: 1
generator_model: openai/gpt-5-nano
generator_prompt: baseline_answer@v1
judge_model: deepseek/deepseek-v4.1-flash
judge_provider_order: [DeepInfra]
judge_allow_fallbacks: false
judge_embedding_model: qwen/qwen3-embedding-8b
