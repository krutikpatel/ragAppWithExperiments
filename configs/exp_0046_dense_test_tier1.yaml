# exp_0046_dense_test_tier1 — dense control (= promoted) on test, Tier 1
#
# P2-18 — the test split, opened ONCE at the end of Phase 2. Requires --open-test and
# writes a row to the openings log in docs/DECISIONS.md (P0-12).
#
# `promoted.yaml` IS the Phase 1 dense control: it has never moved, because no technique
# in Phase 2 earned promotion. The story asks for "the Phase 1 dense control, the Phase 1
# sparse control, and the final promoted config" — the first and the third are the same
# configuration, verified by identity_hash 70610a6119fb9223, so there are two arms here,
# not three.
#
# RE-TUNING AFTER THIS RUN IS FORBIDDEN. If anything is changed in response to these
# numbers, the split is burned and that must be disclosed.
# Gap measured against EXP-0005 `run_20260912_225005_be04` (dev, 0.720).
name: "P2-18 dense control (= promoted) on test, Tier 1"
split: test
eval_tier: tier1
retriever: dense
retriever_params:
  embedding_backend: openrouter
  embedding_model: qwen/qwen3-embedding-8b
  embedding_provider: DeepInfra
  batch_size: 64
chunker: fixed_token
chunker_params:
  chunk_size: 600
  overlap: 100
retrieval_depth: 100
