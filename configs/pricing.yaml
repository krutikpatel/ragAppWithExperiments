# Prices in USD per million tokens, per model, per provider. `_model` is the
# model-level (unpinned) price; a named provider is what a pinned config pays
# (DEC-032/034: the two differ ~12x for the judge). Written by `rag pricing
# refresh` from OpenRouter's /models and /models/<id>/endpoints; edit the model
# list by hand, never the numbers. The estimator records pricing_version on
# every run (P2-06, DEC-050).
pricing_version: '2026-09-25'
source: OpenRouter /api/v1/models (model-level) and /api/v1/models/<id>/endpoints
  (per provider)
rerank_source: MEASURED from usage.cost on real 50-document calls, 2026-09-22 (MIS-025).
  OpenRouter's /models/<id>/endpoints reports prompt=0, completion=0 for every rerank
  model while the calls bill real money, so `rag pricing refresh` must never write
  this block.
